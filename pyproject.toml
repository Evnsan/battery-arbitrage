[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-arbitrage"
version = "0.1.0"
description = "Battery dispatch and arbitrage optimization across wholesale electricity markets."
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.mypy]
# 1. Force checking of unannotated code (Crucial for Pylance parity)
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# 2. Tighten up "Any" types and dynamic behavior
disallow_any_generics = true
warn_return_any = true

# 3. Clean up implicit choices and catch bugs
no_implicit_optional = true
strict_optional = true

# 4. Enable Pylance-like code flow warnings
warn_unreachable = true
warn_unused_ignores = true
warn_no_return = true

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
