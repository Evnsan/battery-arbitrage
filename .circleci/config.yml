version: 2.1

jobs:
  python:
    docker:
      - image: cimg/python:3.13
    working_directory: ~/battery-arbitrage
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]"

      - run:
          name: Run linter
          command: |
            ruff check .

      - run:
          name: Type check
          command: |
            mypy src

      - run:
          name: Run tests
          command: |
            python -m pytest

workflows:
  version: 2
  build:
    jobs:
      - python
