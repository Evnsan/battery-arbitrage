version: 2.1

jobs:
  python:
    docker:
      - image: cimg/python:3.13
    working_directory: ~/battery-arbitrage
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -e . "pytest>=8.0"

      - run:
          name: Run tests
          command: |
            python -m pytest

      # No lint command exists yet (no ruff/flake8/mypy config).
      # Add a lint step once a linter is introduced.

workflows:
  version: 2
  build:
    jobs:
      - python
